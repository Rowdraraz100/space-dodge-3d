
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Dodge 3D</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="game-container"></div>

    <div id="start-screen">
        <div class="stars"></div>

        <div class="planet planet-purple"></div>
        <div class="planet planet-green"></div>
        <div class="planet planet-orange"></div>

        <div class="home-content">
            <p class="subtitle">🚀 READY FOR ADVENTURE?</p>

            <h1>SPACE<br><span>DODGE!</span></h1>

            <p class="description">
                Fly your spaceship, dodge asteroids
                and explore the galaxy!
            </p>

            <div class="spaceship-art">
                <div class="flame flame-left"></div>
                <div class="flame flame-right"></div>
                <div class="ship-wing wing-left"></div>
                <div class="ship-wing wing-right"></div>
                <div class="ship-body"></div>
                <div class="ship-window"></div>
            </div>

            <button id="start-button">▶ START GAME</button>

            <p class="controls">
                ⌨️ PC: Arrow Keys / WASD
                <br>
                📱 Mobile: Touch Buttons
            </p>
        </div>

        <div class="bottom-text">
            ★ DEVELOPED BY ROWDRO ★
        </div>
    </div>

    <script type="module" src="/script.js"></script>

</body>
</html>
